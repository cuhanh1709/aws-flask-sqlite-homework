<VirtualHost *:80>
    ServerName _

    WSGIDaemonProcess flaskhomework user=www-data group=www-data threads=5 python-path=/var/www/flaskapp
    WSGIProcessGroup flaskhomework
    WSGIScriptAlias / /var/www/flaskapp/flaskapp.wsgi

    <Directory /var/www/flaskapp>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/flaskhomework_error.log
    CustomLog ${APACHE_LOG_DIR}/flaskhomework_access.log combined
</VirtualHost>
